<div class="max-w-2xl mx-auto p-6 bg-white rounded-lg shadow">
 
  <h1 class="text-3xl font-bold text-gray-900 mb-6">
    Lista Alumnos
  </h1>
 
  <form [formGroup]="formulario">
 
    <!-- Nombre -->
    <div class="mb-5">
 
      <label
        for="matricula"
        class="block mb-2 text-sm font-medium text-gray-900"
      >
        Matricula
      </label>
 
      <input
        type="text"
        id="matricula"
        name="matricula"
        formControlName="matricula"
        required
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
               focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Matricula"
      >

      
      <label
        for="nombre"
        class="block mb-2 text-sm font-medium text-gray-900"
      >
        Nombre
      </label>
 
      <input
        type="text"
        id="nombre"
        name="nombre"
        formControlName="nombre"
        required
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
               focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Nombre"
      >

      
      <label
        for="email"
        class="block mb-2 text-sm font-medium text-gray-900"
      >
        Correo
      </label>
 
      <input
        type="text"
        id="correo"
        name="correo"
        formControlName="correo"
        required
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
               focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Correo"
      >

      
      <label
        for="materia"
        class="block mb-2 text-sm font-medium text-gray-900"
      >
        Materia
      </label>
 
      <input
        type="text"
        id="materia"
        name="materia"
        formControlName="materia"
        required
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
               focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Materia"
      >


      <!-- Error required -->
      <div
        *ngIf="
          contactForm.get('name')?.touched &&
          contactForm.get('name')?.errors?.['required']
        "
        class="p-4 mt-2 text-sm text-red-800 rounded-lg bg-red-50"
        role="alert"
      >
        This field is required.
      </div>
 
      <!-- Error minlength -->
      <div
        *ngIf="
          contactForm.get('name')?.touched &&
          contactForm.get('name')?.errors?.['minlength']
        "
        class="p-4 mt-2 text-sm text-red-800 rounded-lg bg-red-50"
        role="alert"
      >
        Name must be longer than
        {{
          contactForm.get('name')?.errors?.['minlength']?.requiredLength
        }}
        characters.
      </div>
 
    </div>
 
 
    <!-- Mayor de edad -->
    <div class="mb-5">
      <!-- Error checkbox -->
      <div
        *ngIf="
          contactForm.get('checkAdult')?.touched &&
          contactForm.get('checkAdult')?.errors?.['required']
        "
        class="p-4 mt-2 text-sm text-red-800 rounded-lg bg-red-50"
        role="alert"
      >
        This field is required.
      </div>
 
    </div>
 
 

 
 
    <!-- Comentario -->
    <div class="mb-5">
 
 
      <!-- Error required -->
      <div
        *ngIf="
          contactForm.get('comment')?.touched &&
          contactForm.get('comment')?.errors?.['required']
        "
        class="p-4 mt-2 text-sm text-red-800 rounded-lg bg-red-50"
        role="alert"
      >
        This field is required.
      </div>
 
 
      <!-- Botón -->
      <div class="flex justify-end mt-5">
 
        <button
          type="submit"
         
          class="text-white bg-blue-700 hover:bg-blue-800
                 focus:ring-4 focus:outline-none focus:ring-blue-300
                 font-medium rounded-lg text-sm px-5 py-2.5
                 disabled:opacity-50 disabled:cursor-not-allowed"
        >
          Registrar
        </button>
 
      </div>
 
    </div>
 
  </form>
 
</div>
